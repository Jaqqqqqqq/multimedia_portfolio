<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multimedia Portfolio</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #fafbff 0%, #fef8fb 50%, #fff8fc 100%);
      color: #1a1a2e;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated background shapes */
    body::before {
      content: "";
      position: fixed;
      top: 5%;
      left: 5%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(247, 154, 175, 0.06) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
    }

    body::after {
      content: "";
      position: fixed;
      bottom: 10%;
      right: 5%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(245, 120, 141, 0.05) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 10s ease-in-out infinite reverse;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(50px) rotate(8deg); }
    }

    h1, h2, h3 {
      font-family: 'Poppins', sans-serif;
      letter-spacing: -0.5px;
    }

    /* NAVBAR */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 60px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(247, 154, 175, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #f79aaf 0%, #f5788d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      gap: 40px;
    }

    .nav-links a {
      text-decoration: none;
      color: #1a1a2e;
      font-weight: 500;
      position: relative;
      cursor: pointer;
      transition: 0.3s;
      font-size: 15px;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      width: 0;
      height: 2.5px;
      background: linear-gradient(90deg, #f79aaf 0%, #f5788d 100%);
      left: 0;
      bottom: -8px;
      transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border-radius: 2px;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    /* SECTIONS */
    section {
      display: block;
      padding: 100px 60px;
      min-height: 100vh;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { 
        opacity: 0; 
        transform: translateY(15px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }

    /* HOME */
    .home {
      display: flex !important;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .home h1 {
      font-size: 56px;
      margin-bottom: 30px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -1px;
      animation: slideInUp 0.8s ease 0.2s both;
    }

    .home span {
      background: linear-gradient(135deg, #f79aaf 0%, #f5788d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
    }

    .home span::after {
      content: "";
      position: absolute;
      bottom: -5px;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #f79aaf 0%, #f5788d 100%);
      opacity: 0.3;
    }

    .home p {
      max-width: 600px;
      line-height: 1.8;
      font-size: 16px;
      color: #555;
      margin: 0 auto 30px;
      animation: slideInUp 0.8s ease 0.4s both;
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* BUTTON */
    .btn {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #f79aaf 0%, #f5788d 100%);
      color: white;
      border-radius: 25px;
      text-decoration: none;
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 15px;
      border: 2px solid transparent;
      box-shadow: 0 10px 25px rgba(247, 154, 175, 0.3);
      position: relative;
      overflow: hidden;
      animation: slideInUp 0.8s ease 0.5s both;
    }

    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      transition: left 0.3s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(247, 154, 175, 0.4);
    }

  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <a href="index.html" class="logo">Multimedia Portfolio</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="about.html">About</a>
    </div>
  </nav>

  <!-- HOME -->
  <section id="home" class="home active">
    <h1>Hello, welcome to my <span>Multimedia Portfolio</span></h1>
    <p>
      This website showcases my creative projects, designs, and multimedia works.
      Explore my portfolio to see what I've been working on!
    </p>
    <a href="portfolio.html" class="btn">View Projects</a>
  </section>

</body>
</html>
